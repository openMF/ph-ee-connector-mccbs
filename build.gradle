plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.mifos'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    zeebeVersion = '8.4.0'
    jacksonVersion = '2.15.3'
    oauth1SignerVersion = '1.5.3'
    nimbusJoseJwtVersion = '9.37.3'
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Zeebe
    implementation "io.camunda:spring-zeebe-starter:${zeebeVersion}"

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Apache Commons
    implementation 'org.apache.commons:commons-lang3'

    // Mastercard OAuth1 Signing
    implementation "com.mastercard.developer:oauth1-signer:${oauth1SignerVersion}"

    // JWE Encryption (Nimbus JOSE + JWT)
    implementation "com.nimbusds:nimbus-jose-jwt:${nimbusJoseJwtVersion}"

    // JAXB for XML Support (required for Mastercard CBS API)
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
}

tasks.named('test') {
    useJUnitPlatform()
}
